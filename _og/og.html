<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../site.css"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F6F3EC;color:#1C211D}
.og{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box}
.og::after{content:"";position:absolute;right:-120px;top:-60px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6E6DA,transparent 65%),radial-gradient(circle at 65% 70%,#DDE6DC,transparent 65%)}
.b{display:flex;align-items:center;gap:14px;font:700 34px/1 var(--serif);position:relative;z-index:2}.b img{width:64px;height:64px;border-radius:16px}
h1{font-size:76px;line-height:1.02;margin:44px 0 22px;position:relative;z-index:2;width:640px}h1 em{color:#4E7157}
p{font-size:26px;color:#5F665F;width:560px;position:relative;z-index:2;line-height:1.4}
.ph{position:absolute;z-index:1;width:270px;border-radius:42px;padding:8px;background:#141614;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.ph img{border-radius:35px;width:100%}
.p1{right:250px;top:70px}.p2{right:40px;top:130px;transform:rotate(6deg);width:240px}
</style></head><body><div class="og">
<div class="b"><img src="../icon.png">Dialed</div>
<h1>Stop guessing.<br><em>Dial in</em> your espresso.</h1>
<p>Log a shot in 10 seconds. Get one clear tip for the next one.</p>
<div class="ph p2"><img src="../img/next.webp"></div>
<div class="ph p1"><img src="../img/today.webp"></div>
</div></body></html>
